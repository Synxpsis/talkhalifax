# Deploys TalkHalifax to Cloudflare on every push to main (and on demand).
# Pull requests only get the type check.
#
# Needs one repository secret: CLOUDFLARE_API_TOKEN, a Cloudflare API token with
#   Account › Workers Scripts › Edit   and   Account › D1 › Edit
# The account id is in wrangler.jsonc.
name: Deploy

on:
  push:
    branches: [main]
    paths-ignore: ["prototype/**", "README.md"]
  pull_request:
    paths-ignore: ["prototype/**", "README.md"]
  workflow_dispatch:

# One deploy at a time; a newer push waits for the running one instead of cancelling it mid-migration
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Client script parses
        run: node --check public/app.js

  deploy:
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply database migrations
        run: npx wrangler d1 migrations apply talkhalifax --remote
      - name: Deploy
        run: npx wrangler deploy
